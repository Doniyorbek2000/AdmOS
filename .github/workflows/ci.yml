name: ci

# Fast validation on every push and pull request. Full image builds and QEMU boot/update/rollback
# demonstrations run in image.yml (nightly / manual), because they need root, KVM and minutes of
# build time. See docs/TESTING_STRATEGY.md.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v4.4.0, pinned by commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Python version
        run: python3 --version

      - name: Byte-compile tooling
        run: python3 -m compileall -q tools

      - name: Validation tool unit tests
        run: python3 -m unittest discover -s tools/tests -v

      - name: Repository checks
        run: python3 tools/check_repo.py

  rust:
    name: Rust (fmt, clippy, tests, aarch64, dependency audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          rustc --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: ARM64 compile check
        run: cargo check --workspace --locked --target aarch64-unknown-linux-gnu

      - name: Install dependency auditors (built from crates.io sources, version-pinned)
        run: |
          set -euo pipefail
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      - name: cargo deny (licenses, bans, sources, advisories)
        run: cargo deny check

      - name: cargo audit (RustSec)
        run: cargo audit

  image-config:
    name: Image configuration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install mkosi
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mkosi

      - name: Static image checks (no build, no network)
        run: tools/nur verify --skip-rust
