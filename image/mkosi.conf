# NUR OS image definition (mkosi). Canonical entry point: `tools/nur build` (see image/README.md).
# Do not invoke mkosi directly for anything other than debugging: tools/nur injects the build
# version, signing material paths, NUR binaries, and the output directory.

[Distribution]
# D1 (approved): Debian stable is the base userspace. Overridden only by explicit --base selection.
@Distribution=debian
Architecture=x86-64

[Output]
ImageId=nur
Format=disk
SplitArtifacts=yes
# Deterministic partition-table metadata (disk GUID etc.). Partition UUIDs of /usr and its
# verity partition are derived from the verity root hash by systemd-repart.
Seed=6e7572d0-5b3a-4f1e-9c2d-0a5b9e1f0001

[Content]
Bootable=yes
Bootloader=systemd-boot
WithDocs=no
# Package metadata lives in /var, which is never part of the shipped /usr image; it is kept
# during the build so mkosi can record the package manifest used for the SBOM.
CleanPackageMetadata=no
Locale=C.UTF-8
Timezone=UTC
Hostname=nur
KernelCommandLine=
        console=ttyS0,115200
        panic=10
        mount.usr=/dev/mapper/usr
        mount.usrfstype=erofs
        mount.usrflags=ro
        systemd.verity_usr_options=restart-on-corruption
        systemd.firstboot=off
        rw

Packages=
        systemd
        systemd-sysv
        systemd-boot-efi
        udev
        dbus
        kmod
        util-linux
        fdisk
        e2fsprogs
        dmsetup
        bash
        less
        procps

RemoveFiles=
        # Some bases mask gpt-auto via /etc; NUR relies on the Discoverable Partitions Specification
        # (ESP at /efi, state partition discovery).
        /etc/systemd/system-generators/systemd-gpt-auto-generator

[Validation]
SecureBootAutoEnroll=no
SignExpectedPcr=no
