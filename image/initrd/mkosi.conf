# NUR initrd (kernel-independent). Kernel modules are appended per kernel by the main image build
# (mkosi KernelModulesInitrd=yes). Built by `tools/nur build` before the main image.
#
# Responsibilities in the boot chain:
#   * open /usr via dm-verity using usrhash= from the signed UKI command line;
#   * on first boot, create the encrypted state (root) partition with systemd-repart using the
#     definitions shipped in the verified /usr image (/sysusr/usr/lib/repart.d);
#   * unlock the state partition (TPM2-bound LUKS2) and switch root.

[Distribution]
@Distribution=debian
Architecture=x86-64

[Output]
ImageId=nur-initrd
Format=cpio

[Content]
Bootable=no
MakeInitrd=yes
# Package metadata lives in /var, which is never part of the shipped /usr image; it is kept
# during the build so mkosi can record the package manifest used for the SBOM.
CleanPackageMetadata=no
WithDocs=no
Locale=C.UTF-8
Packages=
        systemd
        udev
        kmod
        util-linux
        e2fsprogs
        dmsetup
        bash

RemoveFiles=
        # Some bases mask gpt-auto via /etc; NUR relies on the Discoverable Partitions Specification.
        /etc/systemd/system-generators/systemd-gpt-auto-generator
        /usr/lib/systemd/catalog
        /etc/udev/hwdb.d
        /usr/lib/udev/hwdb.d
        /usr/lib/modules/*/vmlinuz*
        /usr/lib/modules/*/System.map
        /usr/share/locale/*
