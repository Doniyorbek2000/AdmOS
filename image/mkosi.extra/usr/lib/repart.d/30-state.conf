# Mutable machine state: /etc overrides, /var (logs, service state), /home.
# Created on first boot, encrypted with LUKS2 and bound to the TPM2 (no passphrase is
# enrolled, so there is no silent fallback to a weaker unlock method). A factory reset
# (factory-reset.target) re-creates it empty.
[Partition]
Type=root
Label=nur-state
Format=ext4
Encrypt=tpm2
FactoryReset=yes
SizeMinBytes=1G
# Top-level directories needed before systemd-tmpfiles runs (e.g. /efi for the ESP mount
# created by systemd-gpt-auto-generator on first boot).
MakeDirectories=/efi /etc /var /home /root /srv /tmp
