# ENVIRONMENT SUBSTITUTE — NOT THE NUR BASE.
# Used only when `tools/nur build --base ubuntu-noble` is requested because the build
# environment cannot reach Debian mirrors. It exists so the NUR-owned layers (boot chain,
# verity, A/B, update, health, encryption) can be exercised end-to-end. Artifacts built from it
# are labelled NUR_BASE=ubuntu:noble in their metadata and must never be published.
[Match]
Distribution=ubuntu

[Distribution]
Release=noble
Repositories=main,universe

[Content]
Packages=
        linux-image-virtual
        libtss2-esys-3.0.2-0t64
        libtss2-rc0t64
        libtss2-mu-4.0.1-0t64
        libtss2-tcti-device0t64
